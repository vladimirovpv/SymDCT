# Geometric cutoffs for jump network construction
# All distances in angstrom

units:
  length: angstrom

# Bond cutoffs: "TYPE1-TYPE2" keys are order-independent (A-B == B-A).
# The code normalises pairs alphabetically before lookup.
# Any pair not listed is treated as unconnected.
bonds:
  "A-A": 1.4
  "A-H": 2.6
  "C-C": 3.00
  "C-H": 1.4
  "H-H": 0.0 # forbidden jump
