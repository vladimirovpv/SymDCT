# Illustrative energetics for the bcc direct-interstitial model (Haus and
# Kehr, Phys. Rep. 150, 1987, section 2.4(ii)), NOT DFT data. The model keeps O as a
# genuine metastable site with its own energy, connected to T by O-T jumps
# alongside the direct T-T jumps.
settings:
  length_tolerance: 0.01
  units:
    energy: eV
    length: angstrom
    frequency: THz
site frequencies:
  default_frequency: 10.0
site energies:
  T: 0.0
  O: 0.1
jumps:
  T-T:
    - jump_id:
        forward: 0
        backward: 0
      length: 1.431891
      energy_sp: 0.35
  O-T:
    - jump_id:
        forward: 2
        backward: 1
      length: 1.0125
      energy_sp: 0.3
lattice constants:
  a: 3.5074029
  b: 3.5074029
  c: 3.5074029
symbol_alias_map:
  Al: Al
  O: O
  H: T
