# Artificial example to test evaluation of energetics.yaml files.
# ----------------------------------------------------------------
# Solution energies from 10.1016/j.rinp.2024.107590
# taken without ZPE correction. O-site is treated artificially as
# a shallow metastable site with backward O-T barrier of 0.1 eV
settings:
  length_tolerance: 0.01
  units:
    energy: eV
    length: angstrom
    frequency: THz
# optional lattice constants for bcc
lattice constants:
  a: 3.165
  b: 3.165
  c: 3.165
site frequencies:
  default_frequency: 10.0
#  T: null
#  O: null
site energies:
  T: 0.173
  O: 0.301
jumps:
  T-T:
    - jump_id:
        forward: 0
        backward: 0
      length: 1.431891
      energy_sp: 0.263
  O-T:
    - jump_id:
        forward: 1
        backward: 2
      length: 1.0125
      energy_sp: 0.311
