# Migration barriers: Ferry et al., J. Nucl. Mater. 524 (2019) 208-215,
# DFT explicit-vacancy diffusion study of hcp Be.
#   In basal plane:     0.66 eV  (mapped to the A-A / B-B jumps below)
#   Out of basal plane: 0.83 eV  (mapped to the A-B jump below)
# Site energies are set to 0 eV (A, B are symmetry-equivalent vacancy
# sites), so energy_sp is used directly as the migration energy E_m.
settings:
  length_tolerance: 0.01
  units:
    energy: eV
    length: angstrom
    frequency: THz
site frequencies:
  default_frequency: 10.0
site energies:
  A: 0.0
  B: 0.0
jumps:
  A-A:
    - jump_id:
        forward: 0
        backward: 0
      length: 2.262
      energy_sp: 0.66  # Ferry et al. 2019, in-plane (basal) barrier
  A-B:
    - jump_id:
        forward: 1
        backward: 3
      length: 2.211735
      energy_sp: 0.83  # Ferry et al. 2019, out-of-basal-plane barrier
  B-B:
    - jump_id:
        forward: 2
        backward: 2
      length: 2.262
      energy_sp: 0.66  # Ferry et al. 2019, in-plane (basal) barrier
lattice constants:
  a: 2.2619996
  b: 2.2619996
  c: 3.5699992
symbol_alias_map:
  A: A
  B: B
